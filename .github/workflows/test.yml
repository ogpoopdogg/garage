name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Garage helpers (vehicles, problems, oil checks, search, entries)
        run: node --test tests/garage.test.mjs
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Database rules (Realtime Database emulator)
        working-directory: tests/rules
        run: npm ci && npm test
